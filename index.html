<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>PlayBeat Digital — Premium Digital Marketplace & Smart Projectors</title>
    <meta name="title" content="PlayBeat Digital — Premium Digital Marketplace & Smart Projectors" />
    <meta name="description" content="Instant digital keys, gaming accounts, subscriptions, SaaS licenses, and high-performance 4K Smart Projectors with 24/7 automated delivery." />
    <meta name="keywords" content="gaming keys, game accounts, streaming subscriptions, smart projectors, IPTV, SaaS tools, gift cards, instant delivery" />
    <meta name="author" content="PlayBeat Digital" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://playbeat.digital/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayBeat Digital" />
    <meta property="og:title" content="PlayBeat Digital — Luxury Digital Commerce & Smart Projectors" />
    <meta property="og:description" content="Instant digital keys, game accounts, streaming subscriptions & 4K Smart Projectors with 24/7 automated delivery." />
    <meta property="og:url" content="https://playbeat.digital/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlayBeat Digital — Premium Digital Marketplace & Smart Projectors" />
    <meta name="twitter:description" content="Instant digital keys, gaming accounts, subscriptions & 4K Smart Projectors with 24/7 automated delivery." />

    <!-- Theme + Icons -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PlayBeat Digital",
        "url": "https://playbeat.digital",
        "logo": "https://playbeat.digital/logo.png",
        "description": "Premium digital products marketplace, gaming accounts, software licenses and smart projectors.",
        "sameAs": []
      }
    </script>

    <!-- WebSite Structured Data (with SearchAction) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PlayBeat Digital",
        "url": "https://playbeat.digital",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://playbeat.digital/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Store Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "PlayBeat Digital",
        "url": "https://playbeat.digital",
        "currenciesAccepted": "USD, EUR, GBP, PKR",
        "paymentAccepted": "Credit Card, PayPal, JazzCash, Easypaisa, Crypto"
      }
    </script>
  </head>
  <body class="bg-[#0A0A0A] text-white antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
